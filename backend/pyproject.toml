[project]
name = "biteride-backend"
version = "0.1.0"
description = "biteRide Delivery Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.104.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "psycopg2-binary>=2.9.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "celery>=5.3.0",
    "ruff>=0.14.4",
    "pydantic-settings>=2.12.0",
    "requests>=2.32.5",
    "sqlmodel>=0.0.27",
    "inflect>=7.5.0",
    "pyjwt>=2.10.1",
    "asyncpg>=0.30.0",
    "bcrypt<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",
]

[tool.uv.run]
main = "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

[tool.ruff]
# Enable Pyflakes and pycodestyle rules
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # Pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]

# Ignore the following rules
ignore = [
    "E501",  # line too long, handled by format
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

# Line length (same as Black)
line-length = 88

# Exclude files and directories
exclude = [
    ".eggs",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    "migrations",
]

[tool.ruff.format]
# Formatting configuration (replaces Black)
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.isort]
# Import sorting (replaces isort)
known-first-party = ["app"]
lines-after-imports = 2
combine-as-imports = true

[tool.ruff.per-file-ignores]
# Specific file ignores
"__init__.py" = ["F401"]  # unused import in __init__ files
"tests/**/*.py" = ["S101"]  # allow asserts in tests

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

# FastAPI specific ignores
[[tool.mypy.overrides]]
module = [
    "fastapi.*",
    "sqlalchemy.*", 
    "alembic.*",
    "pydantic.*",
]
ignore_missing_imports = true
