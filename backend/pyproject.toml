[project]
name = "biteride-backend"
version = "0.1.0"
description = "biteRide Delivery Backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.104.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "psycopg2-binary>=2.9.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
]

[tool.uv.run]
main = "uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
